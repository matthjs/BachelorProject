dgp_hidden_layers_config:
  - output_dims: 1    # 4 1s -> 0.7933..
    mean_type: linear
  - output_dims: 1
    mean_type: linear
  # Uncomment if needed
  - output_dims: 1
    mean_type: linear
  - output_dims: 1
    mean_type: linear
  - output_dims: null
    mean_type: constant

# avg 0.79333335
#Training execution time 225.937 sec
#Training VRAM usage 0.114 GB
#Training energy usage 8084.306 J
# avg 0.80333334
#Training execution time 304.045 sec
#Training VRAM usage 0.160 GB
#Training energy usage 15941.469 J

fitting:
  gp_fit_num_epochs: 1
  gp_fit_batch_size: 128
  gp_fit_num_batches: 4
  gp_fit_learning_rate: 0.005
  gp_fit_random_batching: True

exploration:    # Not used if thompson sampling is used.
  ucb_beta: 1.5
  gp_e_greedy_steps: 3500

model:
  gp_model_str: "deep_gp"
  discount_factor: 1
  batch_size: 128
  replay_buffer_size: 128
  exploring_starts: 10000   # 100
  max_dataset_size: 10000 # 100000
  sparsification_threshold: None
  gp_likelihood_noise_constraint: None
  kernel_type: "matern"
  strategy: "thompson_sampling"
  posterior_observation_noise: False
  num_inducing_points: 128    # Only has effect if variational GP or deep GP is selected.


  kernel:
    matern_kernel:
      smoothness: 2.5   # mu
      outputscale_constraint:
        lower: None
        upper: None
        use_default: True

    rbf_kernel:
      lengthscale_constraint: # default is 0.6931
        lower: None
        upper: None
        use_default: True
      outputscale_constraint:
        lower: None
        upper: None
        use_default: True

    rff_kernel:
      num_samples: 1024
      outputscale_constraint:
        lower: None
        upper: None
        use_default: True